version: "3.8"

services:
  hivemind-twilio-bridge:
    build: .
    image: hivemind-twilio-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Twilio console credentials (console.twilio.com). Do NOT commit
      # real values here; set them in a .env file or the deployment's
      # secret store.
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_NUMBER: "${TWILIO_NUMBER}"
      # public base URL Twilio's webhook points at, e.g. behind a reverse
      # proxy or ngrok tunnel; informational only, printed at startup.
      PUBLIC_URL: "${PUBLIC_URL}"
      # HiveMind hub credentials, see `hivemind-core add-client`.
      HIVEMIND_ACCESS_KEY: "${HIVEMIND_ACCESS_KEY}"
      HIVEMIND_PASSWORD: "${HIVEMIND_PASSWORD}"
      HIVEMIND_HOST: "${HIVEMIND_HOST:-ws://hivemind-core}"
      HIVEMIND_PORT: "${HIVEMIND_PORT:-5678}"
      HIVEMIND_SITE_ID: "${HIVEMIND_SITE_ID:-twilio}"
      HIVEMIND_LANG: "${HIVEMIND_LANG:-en-us}"
    # if hivemind-core runs as another compose service, uncomment:
    # depends_on:
    #   - hivemind-core
